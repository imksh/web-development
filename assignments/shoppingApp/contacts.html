<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zippi</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header
      class="w-full py-3 px-5 bg-primary text-white d-flex justify-content-between align-items-center"
    >
      <h2>Zippi</h2>
      <ul
        class="d-flex list-unstyled text-white align-items-center my-auto gap-3"
      >
        <li>
          <a href="./index.html" class="text-white text-decoration-none"
            >Home</a
          >
        </li>
        <li>
          <a href="./products.html" class="text-white text-decoration-none"
            >Products</a
          >
        </li>
        <li>
          <a href="./cart.html" class="text-white text-decoration-none">Cart</a>
        </li>
        <li>
          <a
            href="./contacts.html"
            class="text-white text-decoration-none text-muted fw-bold"
            >Contact</a
          >
        </li>
        <li>
          <a href="./about.html" class="text-white text-decoration-none"
            >About</a
          >
        </li>
      </ul>
    </header>

    <main id="main">
      <div class="contact container pt-5">
        <h2 class="text-center">Contact us</h2>
        <div class="d-flex">
          <div class="section1 w-25 justify-content-center align-items-center">
            <img
              src="./src/images/contact.png"
              alt=""
              alt="image"
              class="ms-5 my-5"
              height="450px"
              width="450px"
            />
          </div>
          <div
            class="form w-75 p-5 d-flex flex-column justify-content-center align-items-end gap-3 me-5 pe-5"
          >
            <div class="w-50">
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="Name"
              />
            </div>
            <div class="w-50">
              <input
                type="text"
                class="form-control"
                id="email"
                name="email"
                placeholder="Email"
              />
            </div>
            <div class="w-50">
              <textarea
                name="message"
                id="message"
                placeholder="Type a message"
                class="w-100 p-2"
                rows="5"
                class=""
              ></textarea>
            </div>
            <button class="btn btn-primary" type="button" onclick="contact()">
              Submit
            </button>
          </div>
        </div>
      </div>
    </main>
    <div
      class="cart text-primary bg-primary-subtle rounded-5 d-flex justify-content-around align-items-center d-none"
      id="cartContainer"
    >
      <div class="position-absolute" id="cartAnimate"></div>
      <button class="btn text-primary cup z-2" onclick="clearCart()">
        <i class="bi bi-trash fw-bolder fs-5"></i>
      </button>
      <span class="fw-bolder">Cart: <span id="cartNo"></span></span>
      <button class="btn text-primary cup z-2" onclick="openItems()">
        <i class="bi bi-chevron-right fw-bolder fs-4"></i>
      </button>
    </div>
    <footer
      class="d-flex justify-content-center align-items-center flex-column"
    >
      <div id="infinity" class="infinity m-auto"></div>
      <p class="" style="color: gray">©️IdioticMinds | Crafted with ❤️</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
  </body>
</html>
