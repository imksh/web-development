<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zippi Products</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body onload="cartPage()">
    <header
      class="w-full py-3 px-5 bg-primary text-white d-flex justify-content-between align-items-center"
    >
      <h2>Zippi</h2>
      <ul
        class="d-flex list-unstyled text-white align-items-center my-auto gap-3"
      >
        <li>
          <a href="./index.html" class="text-white text-decoration-none"
            >Home</a
          >
        </li>
        <li>
          <a href="./products.html" class="text-white text-decoration-none"
            >Products</a
          >
        </li>
        <li>
          <a href="./cart.html" class="text-white text-decoration-none text-muted fw-bold">Cart</a>
        </li>
        <li>
          <a href="./contacts.html" class="text-white text-decoration-none"
            >Contact</a
          >
        </li>
         <li>
          <a href="./about.html" class="text-white text-decoration-none"
            >About</a
          >
        </li>
      </ul>
    </header>
    <main id="main" class="vh-100 overflow-hidden z-3">
      <div class="h-100 d-flex">
        <div
          class="w-50 h-100 d-flex justify-content-center flex-column align-items-center"
        >
          <div id="orderInfo" class="d-none flex-column justify-content-center align-items-center">
            <p class="text-primary fs-3 fw-bold">Thankyou</p>
            <p class="text-primary fs-5 fw-bold " >
              We have received your order further details will be shared with
              you
            </p>
          </div>
          <img
            src="./src//images/cart.png"
            alt=""
            width="400px"
            height="400px"
          />
        </div>
        <div class="w-50 h-100 overflow-auto">
          <p class="fs-3 fw-bold text-primary text-center mt-5">Cart</p>
          <div id="cartList" class="mx-auto p-5 pt-2 rounded-4"></div>
          <div
            id=""
            class="border-top d-flex justify-content-between align-items-center py-3 px-4 m-4"
          >
            <span id="totalPrice" class="text-primary fw-bold fs-5"></span>
            <button class="btn btn-primary" onclick="checkout()">
              Checkout
            </button>
          </div>
        </div>
      </div>
    </main>

   

    <div id="cartCheckOut" class="d-none"></div>

      <button class="btn text-primary cup z-2" onclick="clearCart()">

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
