<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="w-full p-3 text-center bg-primary text-white">
      <h2>Form Validation</h2>
    </header>

    <div
      class="container d-flex flex-column w-50 gap-4 mt-5 border p-5 rounded"
    >
      <h2 class="text-center fw-bolder text-primary fs-1">Form</h2>
      <div class="d-flex align-items-center">
        <label for="name" class="w-25 fw-bold">Full Name:</label>
        <input
          type="text"
          placeholder=""
          name="name"
          id="name"
          class="form-control w-75"
        />
      </div>
      <div class="d-flex align-items-center">
        <label for="email" class="w-25 fw-bold">Email:</label>
        <input
          type="email"
          placeholder=""
          name="email"
          id="email"
          class="form-control w-75"
        />
      </div>
      <div class="d-flex align-items-center">
        <label for="number" class="w-25 fw-bold">Number:</label>
        <input
          type="number"
          placeholder=""
          name="number"
          id="number"
          class="form-control w-75"
        />
      </div>
      <div class="d-flex align-items-center">
        <label for="dob" class="w-25 fw-bold">Date of Birth:</label>
        <input
          type="date"
          placeholder=""
          name="dob"
          id="dob"
          class="form-control w-75"
        />
      </div>
      <button
        type="submit"
        class="btn btn-primary ms-auto my-2 w-25 py-2"
        onclick="submit()"
      >
        Submit
      </button>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
